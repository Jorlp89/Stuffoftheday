<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thing of the Day embed proof</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#ebe8df;font:16px system-ui;color:#132b33}
    main{max-width:1200px;margin:auto}.frame{aspect-ratio:16/9;background:#fff;border:2px solid #132b33;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px #132b3322}
    iframe{width:100%;height:100%;border:0}code{background:#fff;padding:.15em .4em;border-radius:.3em}
  </style>
</head>
<body>
  <main>
    <h1>Canva-compatible embed proof</h1>
    <p>Live public Railway embed: <code>https://stuffoftheday-production.up.railway.app</code></p>
    <div class="frame"><iframe src="https://stuffoftheday-production.up.railway.app" title="Thing of the Day dashboard" loading="eager" allow="fullscreen"></iframe></div>
  </main>
</body>
</html>
